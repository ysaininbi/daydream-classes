<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>DAYDREAM Admin Dashboard</title>
<style>
body{margin:0;font-family:Arial;background:#f7f4fb;color:#251a35}.top{background:linear-gradient(135deg,#35106d,#7c3aed);color:white;padding:25px}.wrap{max-width:1200px;margin:auto;padding:25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:white;border-radius:15px;padding:20px;box-shadow:0 5px 20px #0001}.stat b{font-size:32px;color:#6d28d9;display:block}.panel{background:white;border-radius:15px;margin-top:20px;padding:20px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}th{background:#f3edff}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}input,select{padding:10px;border:1px solid #ddd;border-radius:8px}.btn{padding:10px 15px;border:0;border-radius:8px;background:#6d28d9;color:#fff;font-weight:bold;cursor:pointer}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="top"><div class="wrap"><h1>DAYDREAM ADMIN DASHBOARD</h1><div>Student enquiries & visitor analytics</div></div></div>
<div class="wrap"><div class="stats"><div class="stat"><b id="visits">—</b>Today's Visits</div><div class="stat"><b id="leads">—</b>Today's Enquiries</div><div class="stat"><b id="classes">—</b>Classes Represented</div><div class="stat"><b id="total">—</b>Total Enquiries</div></div>
<div class="panel"><h2>Student Enquiries</h2><div class="filters"><input type="date" id="date"><select id="class"><option value="">All Classes</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>JEE</option><option>B.Sc.</option><option>M.Sc.</option></select><button class="btn" onclick="load()">Refresh</button></div><div id="table">Loading...</div></div></div>
<script>
const API="https://script.google.com/macros/s/AKfycbxigPUVAFZtQ0BeEpxX3naASAvQKnetP0ubd3b7l_pLuFuI7u8KxCPbZtQh3pIzeCmMaA/exec";
async function load(){if(API.includes("PASTE_")){document.getElementById("table").innerHTML="<p>Google Apps Script URL add karein.</p>";return}
try{const r=await fetch(API+"?action=dashboard");const d=await r.json();render(d)}catch(e){document.getElementById("table").innerHTML="<p>Dashboard API setup required.</p>"}}
function render(d){document.getElementById("visits").textContent=d.todayVisits;document.getElementById("leads").textContent=d.todayLeads;document.getElementById("classes").textContent=d.todayClasses;document.getElementById("total").textContent=d.totalLeads;
let rows=d.leads.map(x=>"<tr><td>"+x.date+"</td><td>"+x.time+"</td><td>"+x.name+"</td><td>"+x.cls+"</td><td>"+x.phone+"</td></tr>").join("");document.getElementById("table").innerHTML="<table><tr><th>Date</th><th>Time</th><th>Name</th><th>Class</th><th>Contact</th></tr>"+rows+"</table>"}
load();
</script></body></html>
